 {% load static %}
 
 <header class="header">
        <div class="container header-inner">
            <a href="{% url 'main:index' %}" class="header-brand">
                <img src="{% static 'icons/tea-leaf.png' %}" alt="">
                <span class="header-brand-text">Чай из Китая</span>
            </a>

            <nav class="header-nav">
                <a href="{% url 'main:index' %}"
                class="header-link {% if request.resolver_match.url_name == 'index' %}header-link--active{% endif %}">
                    Главная
                </a>

                <a href="{% url 'main:catalog' %}"
                class="header-link {% if request.resolver_match.url_name == 'catalog' %}header-link--active{% endif %}">
                    Каталог
                </a>

                <a href="{% url 'main:about' %}"
                class="header-link {% if request.resolver_match.url_name == 'about' %}header-link--active{% endif %}">
                    О нас
                </a>

                <a href="{% url 'main:contacts' %}"
                class="header-link {% if request.resolver_match.url_name == 'contacts' %}header-link--active{% endif %}">
                    Контакты
                </a>
            </nav>

            <div class="header-icons">
                <details class="header-search">
                    <summary class="header-search-toggle" aria-label="Открыть поиск">
                        <img src="{% static 'icons/search.svg' %}" alt="">
                    </summary>
                    <form action="{% url 'main:catalog' %}" method="get" class="header-search-form" role="search">
                        <label class="visually-hidden" for="site-search">Поиск по товарам</label>
                        <input type="search" name="q" id="site-search" maxlength="100"
                               value="{% if request.GET.q %}{{ request.GET.q }}{% endif %}"
                               placeholder="Найти чай" required>
                        <button type="submit">Найти</button>
                    </form>
                </details>
                
                {% if user.is_authenticated %}
                    <!-- Профиль пользователя ведет в личный кабинет -->
                    <a href="{% url 'users:account' %}" aria-label="Личный кабинет" class="header-user-link">
                        <span class="header-user-avatar" aria-hidden="true">
                            {% if user.profile.avatar %}
                                <img src="{{ user.profile.avatar.url }}" alt="" class="header-user-avatar__image">
                            {% else %}
                                <img src="{% static 'icons/person.svg' %}" alt="" class="header-user-avatar__image header-user-avatar__image--default">
                            {% endif %}
                        </span>
                    </a>
                {% else %}
                    <!-- Если не вошел: ведем на страницу входа -->
                    <a href="{% url 'users:login' %}" aria-label="Войти" class="header-user-link">
                        <img src="{% static 'icons/person.svg' %}" alt="Профиль">
                    </a>
                {% endif %}

                <a href="{% url 'cart:cart_detail' %}" class="header-cart" aria-label="Корзина">
                    <img src="{% static 'icons/cart3.svg' %}" alt="">
                    <span class="cart-badge">{{ cart|length }}</span>
                </a>
            </div>
        </div>

    </header>
