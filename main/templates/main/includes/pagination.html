{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Пагинация каталога">
    {% if page_obj.has_previous %}
        <a class="pagination-arrow" href="?{% if query_params %}{{ query_params }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" aria-label="Предыдущая страница">‹</a>
    {% endif %}
    {% for number in page_obj.paginator.page_range %}
        {% if number == page_obj.number %}
            <span class="pagination-page pagination-page--active" aria-current="page">{{ number }}</span>
        {% else %}
            <a class="pagination-page" href="?{% if query_params %}{{ query_params }}&amp;{% endif %}page={{ number }}">{{ number }}</a>
        {% endif %}
    {% endfor %}
    {% if page_obj.has_next %}
        <a class="pagination-arrow" href="?{% if query_params %}{{ query_params }}&amp;{% endif %}page={{ page_obj.next_page_number }}" aria-label="Следующая страница">›</a>
    {% endif %}
</nav>
{% endif %}
