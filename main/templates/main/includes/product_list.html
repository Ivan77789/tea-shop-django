{% load static %}

<div class="product-grid">
    {% for product in products %}
    <div class="product-card">
        <div class="product-card-image">
            <img src="{{ product.image.url }}" alt="{{ product.name }}">
            <button type="button" class="favorite-btn" data-id="{{ product.id }}" aria-label="В избранное">
                <i class="bi bi-heart" aria-hidden="true"></i>
            </button>
        </div>
        <div class="product-name">
            <a href="{% url 'main:product_detail' product.slug %}">
                <h3 class="product-title">{{ product.name }}</h3>
            </a>
        </div>
        <p class="product-description">{{ product.description|striptags|truncatechars:160 }}</p>
        {% if product.weight %}<p class="product-card-weight">{{ product.weight }} г</p>{% endif %}
        <p class="product-price">
            {{ product.price }} <span class="product-price-currency">₴</span>
        </p>
            <button type="button" class="product-btn add-to-cart-btn" data-id="{{ product.id }}">
                <i class="bi bi-cart" aria-hidden="true"></i> В корзину
            </button>
    </div>
    {% empty %}
    <p>Товары пока не добавлены.</p>
    {% endfor %}
</div>
