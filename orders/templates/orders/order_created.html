{% extends "base.html" %}

{% block title %}Заказ оформлен — Чайный Мир{% endblock %}

{% block content %}
<section class="cart order-confirmation">
    <div class="container">
        <h1 class="order-confirmation__title">Спасибо за заказ!</h1>
        <p class="order-confirmation__message">Ваш заказ <strong>№{{ order.id }}</strong> успешно принят.</p>
        <p class="order-confirmation__phone">Мы свяжемся с вами по телефону <strong>{{ order.phone }}</strong> для подтверждения.</p>
        
        <a href="{% url 'main:catalog' %}" class="button-catalog order-confirmation__link">
            Вернуться в каталог
        </a>
    </div>
</section>
{% endblock %}
